    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // --- IST Clock Widget ---
    function ISTClock() {
      const [timeState, setTimeState] = useState(null);

      useEffect(() => {
        const formatter = new Intl.DateTimeFormat('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });

        const updateTime = () => {
          const parts = formatter.formatToParts(new Date());
          const hour = parts.find(p => p.type === 'hour')?.value || '7';
          const minute = parts.find(p => p.type === 'minute')?.value || '15';
          const period = parts.find(p => p.type === 'dayPeriod')?.value?.toUpperCase() || 'AM';
          setTimeState({ hour, minute, period });
        };

        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="fixed left-5 top-5 z-30 flex items-center gap-3">
          <div className="glass-pill px-3.5 py-1.5 rounded-full flex items-center gap-2 text-sm font-medium text-white shadow-lg border border-white/20">

    // --- Nostalgia Sound Effects Synthesizer ---
    function NostalgiaSFX() {
      const [activeEffect, setActiveEffect] = useState(null);

      const playDoorSFX = () => {
        try {
          setActiveEffect('door');
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          
          const bufferSize = ctx.sampleRate * 0.35;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.12));
          }

          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(750, ctx.currentTime);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.7, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);

          whiteNoise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          whiteNoise.start();

          setTimeout(() => {
            const osc = ctx.createOscillator();
            const clickGain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.1);
            clickGain.gain.setValueAtTime(0.9, ctx.currentTime);
            clickGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(clickGain);
            clickGain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          }, 140);

          setTimeout(() => setActiveEffect(null), 500);
        } catch (e) {
          setActiveEffect(null);
        }
      };

      const playHornSFX = () => {
        try {
          setActiveEffect('horn');
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'sawtooth';
          osc1.frequency.setValueAtTime(370, ctx.currentTime);
          osc2.frequency.setValueAtTime(435, ctx.currentTime);

          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start();
          osc2.start();
          osc1.stop(ctx.currentTime + 0.4);
          osc2.stop(ctx.currentTime + 0.4);

          setTimeout(() => setActiveEffect(null), 500);
        } catch (e) {
          setActiveEffect(null);
        }
      };

      return (
        <div className="fixed right-5 bottom-28 z-30 flex flex-col gap-2">
          <button
            onClick={playDoorSFX}
            className={`glass-pill px-3 py-2 rounded-full flex items-center gap-2 text-xs font-medium text-amber-200 shadow-lg transition-all active:scale-95 ${

            }`}

          </button>

    }

    // --- Glassmorphic Cassette Audio Player ---
    let ytPromise = null;

    function AudioPlayer({ currentTrackIndex, onTrackChange, onOpenPlaylist, musicVolume, customTrackId }) {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isReady, setIsReady] = useState(false);
      const [progress, setProgress] = useState({ current: 0, duration: 0 });
      const containerRef = useRef(null);
      const playerRef = useRef(null);

      const activeTrack = customTrackId 
        ? { title: "Custom Stream", artist: "YouTube Track", movie: "User Selection", cover: OMNI_PLAYLIST[0].cover, youtubeId: customTrackId }
        : OMNI_PLAYLIST[currentTrackIndex] || OMNI_PLAYLIST[0];

      useEffect(() => {
        let mounted = true;
        if (!ytPromise) {
          ytPromise = new Promise(resolve => {
            if (window.YT && window.YT.Player) {
              resolve(window.YT);
            } else {
              const prev = window.onYouTubeIframeAPIReady;
              window.onYouTubeIframeAPIReady = () => {
                if (prev) prev();
                resolve(window.YT);
              };
              const tag = document.createElement('script');
              tag.src = 'https://www.youtube.com/iframe_api';
              document.head.appendChild(tag);
            }
          });
        }

        ytPromise.then((YT) => {
          if (!mounted || !containerRef.current || playerRef.current) return;
          playerRef.current = new YT.Player(containerRef.current, {
            videoId: activeTrack.youtubeId,
            playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, start: 5 },
            events: {
              onReady: (e) => {
                setIsReady(true);
                e.target.setVolume(Math.round(musicVolume * 100));
              },
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.PLAYING) setIsPlaying(true);
                else if (e.data === YT.PlayerState.PAUSED) setIsPlaying(false);
                else if (e.data === YT.PlayerState.ENDED) {
                  setIsPlaying(false);
                  onTrackChange((currentTrackIndex + 1) % OMNI_PLAYLIST.length);
                }
              }
            }
          });
        });

        return () => { mounted = false; };
      }, []);

      useEffect(() => {
        if (playerRef.current && isReady && activeTrack.youtubeId) {
          playerRef.current.loadVideoById(activeTrack.youtubeId, 5);
          setIsPlaying(true);
        }
      }, [currentTrackIndex, customTrackId, isReady]);

      useEffect(() => {
        if (playerRef.current && typeof playerRef.current.setVolume === 'function') {
          playerRef.current.setVolume(Math.round(musicVolume * 100));
        }
      }, [musicVolume]);

      useEffect(() => {
        const interval = setInterval(() => {
          const p = playerRef.current;
          if (p && typeof p.getCurrentTime === 'function' && typeof p.getDuration === 'function') {
            setProgress({ current: p.getCurrentTime() || 0, duration: p.getDuration() || 0 });
          }
        }, 400);
        return () => clearInterval(interval);
      }, []);

      const togglePlay = () => {
        if (!playerRef.current) return;
        if (isPlaying) playerRef.current.pauseVideo();
        else playerRef.current.playVideo();
      };

      const handleSeek = (e) => {
        const p = playerRef.current;
        if (!p || !progress.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        const seekTime = pct * progress.duration;
        p.seekTo(seekTime, true);
        setProgress(prev => ({ ...prev, current: seekTime }));
      };

      const pct = progress.duration > 0 ? (progress.current / progress.duration) * 100 : 0;

      return (
        <div className="w-full max-w-xl mx-auto z-30">
          <div className="pointer-events-none absolute h-px w-px overflow-hidden opacity-0">
            <div ref={containerRef} />
          </div>

          <div className="glass-panel rounded-full p-3 pr-6 flex items-center gap-4 border border-white/20 shadow-2xl">
            {/* Spinning Cassette Vinyl */}
            <div className="relative h-18 w-18 sm:h-20 sm:w-20 shrink-0">
              <div className={`h-full w-full rounded-full overflow-hidden shadow-xl ring-2 ring-white/20 ${isPlaying ? 'animate-spin-slow ring-amber-400/50' : 'opacity-90'}`}>
                <img src={activeTrack.cover} alt={activeTrack.title} className="h-full w-full object-cover" />
              </div>
              <div className="pointer-events-none absolute left-1/2 top-1/2 h-3.5 w-3.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-slate-950/80 ring-2 ring-white/50 flex items-center justify-center">
                <div className="w-1 h-1 rounded-full bg-amber-400"></div>
              </div>
            </div>

            {/* Track Info */}
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded bg-amber-500/20 text-[10px] font-mono text-amber-300 border border-amber-500/30">2008-2012</span>
                <p className="truncate text-sm sm:text-base font-bold text-white">{activeTrack.title}</p>
              </div>
              <p className="truncate text-xs text-white/70 mt-0.5">{activeTrack.artist} • <span className="text-amber-200/90">{activeTrack.movie}</span></p>

              {/* Progress Slider */}
              <div className="mt-2">
                <div onClick={handleSeek} className="group/bar relative h-2 w-full cursor-pointer flex items-center">
                  <div className="h-1.5 w-full overflow-hidden rounded-full bg-white/20">
                    <div className="h-full rounded-full bg-gradient-to-r from-amber-400 to-amber-200" style={{ width: `${pct}%` }} />
                  </div>
                </div>
                <div className="mt-1 flex items-center justify-between text-[11px] font-mono tabular-nums text-white/60">
                  <span>{formatTime(progress.current)}</span>
                  <span>{formatTime(progress.duration)}</span>
                </div>
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-1.5 shrink-0">
              <button onClick={() => onTrackChange((currentTrackIndex - 1 + OMNI_PLAYLIST.length) % OMNI_PLAYLIST.length)} className="p-2 rounded-full text-white/80 hover:bg-white/15">
                ◀◀
              </button>
              <button onClick={togglePlay} disabled={!isReady} className="h-11 w-11 rounded-full bg-amber-400 text-slate-950 font-bold shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 disabled:opacity-50">
                {isPlaying ? '❚❚' : '▶'}
              </button>
              <button onClick={() => onTrackChange((currentTrackIndex + 1) % OMNI_PLAYLIST.length)} className="p-2 rounded-full text-white/80 hover:bg-white/15">
                ▶▶
              </button>
              <button onClick={onOpenPlaylist} className="p-2 rounded-full text-white/80 hover:bg-white/15 ml-1" title="Open Playlist">
                ≡
              </button>
            </div>

          </div>
        </div>
      );
    }

    // --- Main App Root ---
    function App() {
      const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
      const [isPlaylistOpen, setIsPlaylistOpen] = useState(false);
      const [customYoutubeId, setCustomYoutubeId] = useState(null);

      const [musicVolume, setMusicVolume] = useState(0.0);
      const [isCrossfading, setIsCrossfading] = useState(false);
      const [hasInteracted, setHasInteracted] = useState(false);
      const videoRef = useRef(null);

      // Try autoplaying muted video immediately on mount so background video works out of the box
      useEffect(() => {
        const video = videoRef.current;
        if (video) {
          video.muted = true;
          video.play().catch(err => console.log("Muted autoplay notice:", err));
        }
      }, []);

      // 8-Second Audio Crossfade Mechanics
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleTimeUpdate = () => {
          const t = video.currentTime;
          if (t < 6.0) {
            if (!video.muted) video.volume = 1.0;
            setMusicVolume(0.0);
            setIsCrossfading(false);
          } else if (t >= 6.0 && t <= 8.5) {
            const prog = (t - 6.0) / 2.5;
            if (!video.muted) video.volume = Math.max(0, 1 - prog);
            setMusicVolume(Math.min(0.85, prog * 0.85));
            setIsCrossfading(true);
          } else {
            if (!video.muted) video.volume = 0.0;
            setMusicVolume(0.85);
            setIsCrossfading(false);
          }
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        return () => video.removeEventListener('timeupdate', handleTimeUpdate);
      }, []);

      const startRideWithAudio = () => {
        setHasInteracted(true);
        const video = videoRef.current;
        if (video) {
          video.muted = false;
          video.currentTime = 0;
          video.volume = 1.0;
          setMusicVolume(0.0);
          video.play().catch(e => console.log('Unmute play error:', e));
        }
      };

      const handleCustomYoutubeUrl = (input) => {
        let videoId = input;
        if (input.includes('v=')) videoId = input.split('v=')[1]?.split('&')[0];
        else if (input.includes('youtu.be/')) videoId = input.split('youtu.be/')[1]?.split('?')[0];
        if (videoId) setCustomYoutubeId(videoId);
      };

      return (
        <main 
          onClick={() => { if (!hasInteracted) startRideWithAudio(); }} 
          className="relative flex min-h-dvh flex-1 flex-col items-center justify-between overflow-hidden bg-slate-950 cursor-pointer select-none"
        >
          
          {/* Ambient Video Background */}
          <div className="fixed inset-0 -z-10 bg-black overflow-hidden">
            <video
              ref={videoRef}
              src="musics.mp4"
              autoPlay
              playsInline
              muted
              loop
              className="h-full w-full object-cover opacity-90 transition-opacity duration-700"
            />
            <div className="pointer-events-none absolute inset-0 bg-gradient-to-b from-slate-950/70 via-transparent to-slate-950/90" />
            <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_20%,rgba(2,6,23,0.65)_100%)]" />
          </div>

          <ISTClock />
          <LivePassengersCounter />

          <div className="fixed right-5 top-5 z-30 flex items-center gap-2">
            <a href={SPOTIFY_PLAYLIST_URL} target="_blank" rel="noreferrer" className="glass-pill px-3 py-1.5 rounded-full text-xs font-medium text-white shadow-lg">
              Spotify
            </a>
            <a href={YOUTUBE_MUSIC_PLAYLIST_URL} target="_blank" rel="noreferrer" className="glass-pill px-3 py-1.5 rounded-full text-xs font-medium text-white shadow-lg">
              YT Music
            </a>
          </div>

          {/* Hero Branding */}
          <div className="mt-[14vh] flex flex-col items-center px-6 text-center z-20">
            <div className="glass-pill px-4 py-1.5 rounded-full mb-3 flex items-center gap-2 text-xs font-mono text-amber-300 border border-amber-400/30 shadow-lg">
              ✨ 7:15 AM SCHOOL COMMUTE • 2008–2012 ERA
            </div>

            <h1 className="text-5xl sm:text-7xl font-extrabold tracking-tight text-white drop-shadow-[0_4px_24px_rgba(0,0,0,0.9)] uppercase">
              OMNI<span className="text-amber-400 font-mono">VAN</span>
            </h1>

            <p className="mt-2 text-sm sm:text-base text-white/90 font-medium max-w-md drop-shadow-md">
              Sliding door <span className="text-amber-300 font-mono">Kachak!</span>, Nokia 5310 tunes & 2008–2012 school commute hits.
            </p>

            <div className="mt-4 flex flex-col sm:flex-row items-center gap-3">
              {isCrossfading && (
                <div className="glass-pill px-3.5 py-1.5 rounded-full text-xs text-amber-300 animate-pulse border border-amber-400/40">
                  🔊 Van ambient audio fading into 2008-2012 music...
                </div>
              )}

              <button 
                onClick={(e) => { e.stopPropagation(); startRideWithAudio(); }} 
                className="glass-pill px-5 py-2.5 rounded-full text-xs font-bold text-slate-950 bg-amber-400 hover:bg-amber-300 border border-amber-300 transition active:scale-95 shadow-xl flex items-center gap-2"
              >
                <span>Re-live 7:15 AM Van Arrival 🚍</span>
              </button>
            </div>

            {!hasInteracted && (
              <p className="mt-3 text-xs text-amber-300/80 animate-pulse font-mono">
                👆 Tap anywhere on screen to enable van morning audio dialogue!
              </p>
            )}
          </div>

          <NostalgiaSFX />

          <div className="mb-[5vh] w-full px-4 z-30">
            <AudioPlayer
              currentTrackIndex={currentTrackIndex}
              onTrackChange={setCurrentTrackIndex}
              onOpenPlaylist={() => setIsPlaylistOpen(true)}
              musicVolume={musicVolume}
              customTrackId={customYoutubeId}
            />
          </div>

          <PlaylistDrawer
            isOpen={isPlaylistOpen}
            onClose={() => setIsPlaylistOpen(false)}
            currentTrackIndex={currentTrackIndex}
            onSelectTrack={(idx) => { setCustomYoutubeId(null); setCurrentTrackIndex(idx); }}
            onCustomYoutubeUrl={handleCustomYoutubeUrl}
          />

        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
