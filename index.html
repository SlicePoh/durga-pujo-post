    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // --- Minimal IST Clock Widget ---
    function ISTClock() {
      const [timeState, setTimeState] = useState(null);

      useEffect(() => {
        const formatter = new Intl.DateTimeFormat('en-IN', {
          timeZone: 'Asia/Kolkata',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });

        const updateTime = () => {
          const parts = formatter.formatToParts(new Date());
          const hour = parts.find(p => p.type === 'hour')?.value || '12';
          const minute = parts.find(p => p.type === 'minute')?.value || '25';
          const period = parts.find(p => p.type === 'dayPeriod')?.value?.toUpperCase() || 'PM';
          setTimeState({ hour, minute, period });
        };

        updateTime();
        const interval = setInterval(updateTime, 1000);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="fixed left-5 top-5 z-30 text-sm font-medium tabular-nums text-white drop-shadow-[0_1px_6px_rgba(0,0,0,0.6)]">
          {timeState ? (
            <span>
              {timeState.hour}<span className="animate-pulse mx-0.5">:</span>{timeState.minute} <span className="text-white/70 text-xs">{timeState.period}</span>
            </span>
          ) : (
            <span>12:25 PM</span>
          )}
        </div>
      );
    }

      const [count, setCount] = useState(33);

        const updateCount = () => {
          setCount(prev => {
            const delta = Math.random() < (prev < 36 ? 0.58 : 0.42) ? 1 : -1;
            return Math.max(14, Math.min(58, prev + delta * (1 + Math.floor(Math.random() * 3))));

          timeoutId = setTimeout(updateCount, 2500 + Math.random() * 3500);

        timeoutId = setTimeout(updateCount, 2500);
        return () => clearTimeout(timeoutId);

    // --- Single HTML5 Audio Element (One Single Streaming Audio Line) ---
    const AudioPlayer = forwardRef(({ currentTrackIndex, onTrackChange, onOpenPlaylist, musicVolume, customTrackId }, ref) => {
      const [isPlaying, setIsPlaying] = useState(true);
      const [progress, setProgress] = useState({ current: 0, duration: 0 });

      const audioRef = useRef(null);

      const activeTrack = customTrackId 
        ? { title: "Custom Stream", artist: "YouTube Track", movie: "User Selection", cover: OMNI_PLAYLIST[0].cover, audioUrl: OMNI_PLAYLIST[0].audioUrl }
        : OMNI_PLAYLIST[currentTrackIndex] || OMNI_PLAYLIST[0];

      // Auto-start single audio line on mount
      useEffect(() => {
        const aud = audioRef.current;
        if (aud) {
          aud.volume = Math.max(0, Math.min(1, musicVolume));
          aud.play().then(() => setIsPlaying(true)).catch(e => {
            console.log("Autoplay notice:", e);
          });
        }
      }, []);

      // Handle track changes cleanly on the single audio line
      useEffect(() => {
        const aud = audioRef.current;
        if (!aud) return;

        aud.src = activeTrack.audioUrl;
        aud.currentTime = 0;
        aud.volume = Math.max(0, Math.min(1, musicVolume));
        
        aud.play().then(() => setIsPlaying(true)).catch(e => console.log("Track play notice:", e));
      }, [currentTrackIndex]);

      // Synchronize Volume Smoothly on the single audio line
      useEffect(() => {
        const aud = audioRef.current;
        if (aud) {
          aud.volume = Math.max(0, Math.min(1, musicVolume));
        }
      }, [musicVolume]);

      // Progress Tracker
      useEffect(() => {
        const interval = setInterval(() => {
          const aud = audioRef.current;
          if (aud && aud.duration) {
            setProgress({ current: aud.currentTime || 0, duration: aud.duration || 0 });
          }
        }, 400);
        return () => clearInterval(interval);
      }, []);

      const togglePlay = () => {
        const aud = audioRef.current;
        if (!aud) return;
        if (isPlaying) {
          aud.pause();
          setIsPlaying(false);
        } else {
          aud.play().then(() => setIsPlaying(true)).catch(e => console.log('Toggle error:', e));
        }
      };

      const handleSeek = (e) => {
        const aud = audioRef.current;
        if (!aud || !progress.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        const seekTime = pct * progress.duration;
        aud.currentTime = seekTime;
        setProgress(prev => ({ ...prev, current: seekTime }));
      };

      const pct = progress.duration > 0 ? (progress.current / progress.duration) * 100 : 0;

      return (
        <div className="w-full max-w-xl mx-auto">
          {/* THE SINGLE UNIFIED AUDIO ELEMENT FOR THE ENTIRE APPLICATION */}
          <audio 
            ref={audioRef} 
            src={OMNI_PLAYLIST[0].audioUrl} 
            autoPlay
            preload="auto"
            onEnded={() => {
              setIsPlaying(false);
              onTrackChange((currentTrackIndex + 1) % OMNI_PLAYLIST.length);
            }}
          />

          <div className="group relative flex items-center gap-4 rounded-full p-3 pr-5 bg-white/10 backdrop-blur-2xl backdrop-saturate-150 border border-white/20 shadow-[0_8px_40px_rgba(0,0,0,0.45),inset_0_1px_0_rgba(255,255,255,0.25)]">
            
            <div className="relative h-20 w-20 shrink-0">
              <div className={`h-full w-full rounded-full overflow-hidden shadow-lg ring-1 ring-white/20 ${isPlaying ? 'animate-spin-slow' : 'opacity-90'}`}>
                <img src={activeTrack.cover} alt={activeTrack.title} className="h-full w-full object-cover" />
              </div>
              <div className="pointer-events-none absolute left-1/2 top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-black/70 ring-2 ring-white/40" />
            </div>

            <div className="min-w-0 flex-1">
              <p className="truncate text-[15px] font-semibold text-white drop-shadow-sm">{activeTrack.title}</p>
              <p className="truncate text-[13px] text-white/70">{activeTrack.artist}</p>

              <div className="mt-2">
                <div onClick={handleSeek} className="group/bar relative h-2 w-full cursor-pointer" role="slider" aria-label="Seek">
                  <div className="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 overflow-hidden rounded-full bg-white/20">
                    <div className="h-full rounded-full bg-white/90" style={{ width: `${pct}%` }} />
                  </div>
                  <div className="absolute top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white opacity-0 shadow transition-opacity group-hover/bar:opacity-100" style={{ left: `${pct}%` }} />
                </div>
                <div className="mt-1.5 text-left text-[11px] tabular-nums text-white/60">
                  {formatTime(progress.current)} / {formatTime(progress.duration)}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-1">
              <button 
                type="button"
                onClick={() => onTrackChange((currentTrackIndex - 1 + OMNI_PLAYLIST.length) % OMNI_PLAYLIST.length)} 
                className="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95"
                aria-label="Previous track"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
              </button>

              <button 
                type="button"
                onClick={togglePlay} 
                className="grid h-11 w-11 place-items-center rounded-full bg-white text-black shadow-lg transition hover:scale-105 active:scale-95"
                aria-label={isPlaying ? "Pause" : "Play"}
              >
                {isPlaying ? (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zm6 0h4v14h-4z"></path></svg>
                ) : (
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                )}
              </button>

              <button 
                type="button"
                onClick={() => onTrackChange((currentTrackIndex + 1) % OMNI_PLAYLIST.length)} 
                className="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95"
                aria-label="Next track"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"></path></svg>
              </button>

              <button 
                type="button"
                onClick={onOpenPlaylist} 
                className="grid h-9 w-9 place-items-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95 ml-1"
                aria-label="Open playlist"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
              </button>
            </div>

          </div>
        </div>
      );
    });

    // --- Main App Component ---
    function App() {
      const [currentTrackIndex, setCurrentTrackIndex] = useState(() => {
        const saved = localStorage.getItem('omni_pinned_track_index');
        return saved !== null ? parseInt(saved, 10) : 0;
      });

      const [isPlaylistOpen, setIsPlaylistOpen] = useState(false);
      const [customYoutubeId, setCustomYoutubeId] = useState(null);

      const [musicVolume, setMusicVolume] = useState(0.20); // Starts at 20%
      const [introFinished, setIntroFinished] = useState(false);

      const videoRef = useRef(null);
      const audioPlayerRef = useRef(null);

      const handleSetTrack = (idx) => {
        setCurrentTrackIndex(idx);
        localStorage.setItem('omni_pinned_track_index', idx);
      };

      // Direct Automatic Video Playback on Mount (No user interaction needed!)
      useEffect(() => {
        const video = videoRef.current;
        if (video) {
          video.muted = false;
          video.volume = 1.0;
          video.currentTime = 0;
          video.play().catch(e => {
            // Fallback for strict browser policies
            console.log("Unmuted autoplay notice, retrying...", e);
            video.muted = true;
            video.play();
          });
        }
      }, []);

      // Video (100% -> 70%) & Aahun Aahun Music (20% -> 100%) Exact 8-Second Mixing Engine
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleTimeUpdate = () => {
          const t = video.currentTime;
          const duration = video.duration || 15;

          if (!introFinished) {
            if (t <= 8.0) {
              // Video Audio: 100% (1.0) at 0s -> fades down to 70% (0.70) at 8s
              // Music Audio: 20% (0.20) at 0s -> fades up to 100% (1.0) at 8s
              const prog = t / 8.0;
              video.volume = 1.0 - (0.30 * prog);
              setMusicVolume(0.20 + (0.80 * prog));
            } 
            else if (t > 8.0) {
              video.volume = 0.0;
              setMusicVolume(1.0);
              setIntroFinished(true);
            }
          }

          // Continuous Vibe Loop of last 5 seconds
          if (t >= duration - 0.3) {
            const vibeLoopStart = Math.max(8.0, duration - 5.0);
            video.currentTime = vibeLoopStart;
          }
        };

        video.addEventListener('timeupdate', handleTimeUpdate);
        return () => video.removeEventListener('timeupdate', handleTimeUpdate);
      }, [introFinished]);

      const handleCustomYoutubeUrl = (input) => {
        let videoId = input;
        if (input.includes('v=')) videoId = input.split('v=')[1]?.split('&')[0];
        else if (input.includes('youtu.be/')) videoId = input.split('youtu.be/')[1]?.split('?')[0];
        if (videoId) setCustomYoutubeId(videoId);
      };

      return (
        <main className="relative flex min-h-dvh flex-1 flex-col items-center justify-between overflow-hidden select-none">
          
          {/* Background Full-Bleed Video - Layer 0 (Instant Unmuted AutoPlay) */}
          <div className="fixed inset-0 z-0 bg-black overflow-hidden">
            <video
              ref={videoRef}
              src="musics.mp4"
              autoPlay
              playsInline
              className="h-full w-full object-cover"
            />
            {/* Subtle Vignette Layer */}
            <div className="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/50" />
          </div>

          {/* Top Bar Widgets */}
          <ISTClock />
          <LivePassengersCounter />

          <div className="fixed right-5 top-5 z-20 flex items-center gap-2">
            <a 
              href={SPOTIFY_PLAYLIST_URL} 
              target="_blank" 
              rel="noreferrer" 
              className="group/pill flex items-center gap-2 rounded-full text-sm font-medium text-white p-2.5 sm:py-2 sm:pl-3 sm:pr-3.5 drop-shadow-[0_1px_6px_rgba(0,0,0,0.5)] transition hover:opacity-80 active:scale-95"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.42 1.56-.299.421-1.02.599-1.559.3z"></path></svg>
              <span className="hidden sm:inline">Spotify</span>
              <span className="hidden sm:inline-flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="-rotate-45 opacity-50 transition group-hover/pill:opacity-90"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
            </a>

            <a 
              href={YOUTUBE_MUSIC_PLAYLIST_URL} 
              target="_blank" 
              rel="noreferrer" 
              className="group/pill flex items-center gap-2 rounded-full text-sm font-medium text-white p-2.5 sm:py-2 sm:pl-3 sm:pr-3.5 drop-shadow-[0_1px_6px_rgba(0,0,0,0.5)] transition hover:opacity-80 active:scale-95"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"></path></svg>
              <span className="hidden sm:inline">YT Music</span>
              <span className="hidden sm:inline-flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="-rotate-45 opacity-50 transition group-hover/pill:opacity-90"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
            </a>
          </div>

          {/* Central Hero Branding */}
          <div className="mt-[16vh] flex flex-col items-center px-6 text-center z-20">
            <h1 className="text-6xl sm:text-8xl md:text-9xl font-extrabold tracking-tight text-white drop-shadow-[0_4px_28px_rgba(0,0,0,0.85)] font-hindi">
              ओम्नी वैन
            </h1>
          </div>

          {/* Bottom Deck Wrapper */}
          <div className="mb-[8vh] flex flex-col items-center gap-3 z-20 px-6 w-full">
            
            {/* Minimal Glassmorphism "Jaldi Karo!" Button */}
            <button
              type="button"
              onClick={() => {
                const video = videoRef.current;
                if (video) {
                  video.currentTime = 0;
                  video.volume = 1.0;
                  setIntroFinished(false);
                }
              }}
              className="group/pill inline-flex items-center gap-2 rounded-full py-2 px-5 text-xs font-bold text-white bg-white/10 backdrop-blur-xl border border-white/30 shadow-[0_4px_20px_rgba(0,0,0,0.4)] transition hover:bg-white/25 active:scale-95 ring-1 ring-white/20"
            >
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
              <span>Jaldi Karo! 🚌</span>
            </button>

            {/* Bottom Music Player Pill */}
            <AudioPlayer
              ref={audioPlayerRef}
              currentTrackIndex={currentTrackIndex}
              onTrackChange={handleSetTrack}
              onOpenPlaylist={() => setIsPlaylistOpen(true)}
              musicVolume={musicVolume}
              customTrackId={customYoutubeId}
            />
          </div>

          {/* Playlist Drawer Modal */}
          <PlaylistDrawer
            isOpen={isPlaylistOpen}
            onClose={() => setIsPlaylistOpen(false)}
            currentTrackIndex={currentTrackIndex}
            onSelectTrack={(idx) => { setCustomYoutubeId(null); handleSetTrack(idx); }}
            onCustomYoutubeUrl={handleCustomYoutubeUrl}
          />

        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
